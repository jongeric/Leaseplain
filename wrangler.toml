name = "leaseplain"
main = ".open-next/cloudflare/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/cloudflare/assets"
binding = "ASSETS"

# ─── Cloudflare D1 ────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "leaseplain-db"
database_id = "YOUR_D1_DATABASE_ID"

# ─── Cloudflare R2 ────────────────────────────────────────────────────────────
[[r2_buckets]]
binding = "LEASE_BUCKET"
bucket_name = "leaseplain-pdfs"

# ─── Environment Variables ────────────────────────────────────────────────────
[vars]
NEXT_PUBLIC_APP_URL = "https://www.leaseplain.com"

# ─── Secrets (set in Workers dashboard → Settings → Variables and secrets) ────
# ANTHROPIC_API_KEY
# BETTER_AUTH_SECRET
# GITHUB_CLIENT_ID / GITHUB_CLIENT_SECRET
# GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
# STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET
# STRIPE_PRO_PRICE_ID / STRIPE_TEAM_PRICE_ID
