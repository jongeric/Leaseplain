name = "leaseplain"
main = ".open-next/worker.js"
compatibility_date = "2026-05-05"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NEXT_PUBLIC_APP_URL = "https://leaseplain.com"

# ── D1 Database (required for auth + analysis history) ────────────────────────
# Binding is configured in the Cloudflare dashboard (Workers & Pages → D1 → leaseplain-db).
# To apply the schema: npx wrangler d1 execute leaseplain-db --file=migrations/0001_initial.sql --remote

# ── R2 Bucket (optional — PDF storage) ────────────────────────────────────────
# 1. Create: npx wrangler r2 bucket create leaseplain-pdfs
# [[r2_buckets]]
# binding = "LEASE_BUCKET"
# bucket_name = "leaseplain-pdfs"

# ── Secrets (set via: npx wrangler secret put SECRET_NAME) ────────────────────
# ANTHROPIC_API_KEY
# BETTER_AUTH_SECRET       (run: openssl rand -base64 32)
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET

